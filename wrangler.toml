name = "angular-qrcode-restaurant"
compatibility_date = "2026-04-13"
pages_build_output_dir = "dist/angular-qrcode-restaurant/browser"

# Orders persistence (D1). The binding is commented out on purpose: Cloudflare rejects a
# placeholder database_id (error 8000022) and fails the whole deployment. Without it the
# Function falls back to in-memory storage. To enable persistence:
#   1. npx wrangler d1 create angular-qrcode-restaurant-orders
#   2. uncomment the block below and paste the real database_id
#   3. apply the migrations (see README, "Local vs deployed parity")
# [[d1_databases]]
# binding = "ORDERS_DB"
# database_name = "angular-qrcode-restaurant-orders"
# database_id = "<real-database-id>"
# migrations_dir = "functions/migrations"

# Real-time order tracking (WebSocket + Durable Object). Commented out on purpose, like
# ORDERS_DB: the binding only resolves once the Worker in workers/order-room is deployed.
# Without it /api/orders/:id/ws answers 501 and the client falls back to polling.
#   1. npx wrangler deploy --config workers/order-room/wrangler.toml
#   2. uncomment the block below
#   3. optional: npx wrangler pages secret put ORDER_STATUS_TOKEN (enables POST /api/orders/:id/status)
# [[durable_objects.bindings]]
# name = "ORDER_ROOM"
# class_name = "OrderRoom"
# script_name = "angular-qrcode-restaurant-order-room"
