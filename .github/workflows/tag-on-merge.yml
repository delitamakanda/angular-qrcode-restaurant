name: Tag main on PR merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Évite que deux merges rapprochés calculent le même numéro de version
concurrency:
  group: tag-main
  cancel-in-progress: false

jobs:
  tag:
    # "closed" inclut les PR fermées sans merge : on ne tague que les merges
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # nécessaire pour récupérer les tags existants

      - name: Compute next version
        id: version
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          latest=$(git tag --list --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"

          # Label "major" ou "minor" sur la PR => bump correspondant, sinon patch
          if echo "$LABELS" | grep -q '"major"'; then
            major=$((major+1)); minor=0; patch=0
          elif echo "$LABELS" | grep -q '"minor"'; then
            minor=$((minor+1)); patch=0
          else
            patch=$((patch+1))
          fi

          echo "Previous: $latest -> Next: v$major.$minor.$patch"
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Release $TAG (#$PR_NUMBER): $PR_TITLE"
          git push origin "$TAG"

      # Optionnel : crée aussi une GitHub Release avec notes auto-générées
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --generate-notes --verify-tag
