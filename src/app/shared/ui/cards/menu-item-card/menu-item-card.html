<article class="menu-item-card">
  @if (badge(); as badgeType) {
    <app-product-badge [type]="badgeType" />
  }
  <h3>{{ item().name }}</h3>
  <p>{{ item().description }}</p>
  <p>Price: {{ item().base_price | currencyFormat }}</p>

  @if (!item().is_sold_out) {
    <button
      tuiButton
      type="button"
      size="m"
      [attr.aria-label]="'Add to cart: ' + item().name"
      (click)="addToCart()"
    >
      Add to cart
    </button>
  }
</article>
