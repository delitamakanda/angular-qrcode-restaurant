<header
  class="app-header flex items-center justify-between px-4 py-2 bg-white border-gray-200 shadow-sm md:px-6"
>
  <div class="app-header__brand flex items-center gap-3">
    <p class="app-header__title text-lg font-semibold text-gray-900 md:text-xl">
      {{ store()?.name || 'Store' }}
    </p>
    @if (store()) {
      <div
        tuiBadge
        tuiStatus
        size="m"
        class="app-header__status"
        [appearance]="isOpen() ? 'positive' : 'negative'"
        [class.closed]="!isOpen()"
      >
        {{ isOpen() ? 'Open' : 'Closed' }}
      </div>
    }
  </div>
  <a routerLink="./welcome" class="app-header__link shrink-0" aria-label="Home">
    <tui-icon icon="@tui.home" aria-hidden="true"></tui-icon>
  </a>
  <div class="app-header__actions flex gap-2">
    @if (canInstall()) {
      <button
        tuiButton
        appearance="secondary"
        size="s"
        type="button"
        aria-label="Install app"
        (click)="installApp()"
      >
        Install app
      </button>
    }
    <button
      tuiButton
      appearance="secondary"
      size="s"
      type="button"
      aria-label="Reload page"
      (click)="reloadPage()"
    >
      <tui-icon icon="@tui.loader-pinwheel" aria-hidden="true"></tui-icon>
    </button>
  </div>
</header>
