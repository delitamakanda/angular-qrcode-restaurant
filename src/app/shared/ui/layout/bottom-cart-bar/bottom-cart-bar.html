@if (isVisible()) {
  <button
    tuiButton
    appearance="primary"
    size="l"
    class="bottom-cart-bar"
    type="button"
    (click)="goToCart()"
  >
    <span>
      <span
        class="bottom-cart-bar__count"
        [class.bottom-cart-bar__count--pop-a]="pop() === 'a'"
        [class.bottom-cart-bar__count--pop-b]="pop() === 'b'"
        >{{ count() }}</span
      >
      {{ count() === 1 ? 'item' : 'items' }}
    </span>
    <span>View cart</span>
    <strong>{{ total() | currencyFormat }}</strong>
  </button>
}
