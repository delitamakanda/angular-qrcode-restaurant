@if (isVisible()) {
  <button
    tuiButton
    appearance="primary"
    size="l"
    class="bottom-cart-bar"
    type="button"
    (click)="goToCart()"
  >
    <span>{{ count() }} {{ count() === 1 ? 'item' : 'items' }}</span>
    <span>View cart</span>
    <strong>{{ total() | currencyFormat }}</strong>
  </button>
}
