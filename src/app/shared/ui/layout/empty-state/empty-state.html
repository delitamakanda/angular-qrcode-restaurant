<div class="empty-state flex flex-col items-center justify-center text-center" role="status">
  @if (icon(); as icon) {
    <tui-icon class="empty-state__icon" [icon]="icon" aria-hidden="true"></tui-icon>
  }
  <h2 class="empty-state__title text-lg font-semibold text-ink">{{ title() }}</h2>
  @if (description(); as description) {
    <p class="empty-state__description">{{ description }}</p>
  }
  <div class="empty-state__action"><ng-content /></div>
</div>
