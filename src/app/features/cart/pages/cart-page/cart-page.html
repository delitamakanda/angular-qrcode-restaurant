<section class="cart-page">
  <h1>Panier</h1>

  <p class="cart-page__live" role="status" aria-live="polite">{{ announcement() }}</p>

  @for (item of cartStore.items(); track item.id) {
    <div class="cart-row-wrapper">
      <span class="cart-row-wrapper__action" aria-hidden="true">Remove</span>
      <div class="cart-row" appSwipeAction (swiped)="onSwiped(item.id, item.name)">
        <div>
          <strong>{{ item.name }}</strong>
          <div>{{ item.quantity }} x {{ item.unit_base_price | currencyFormat }}</div>
          <div>Total: {{ item.total_price | currencyFormat }}</div>

          <button
            tuiButton
            type="button"
            appearance="secondary"
            size="s"
            [attr.aria-label]="'Remove ' + item.name + ' from cart'"
            (click)="cartStore.removeFromCart(item.id)"
          >
            Remove
          </button>
        </div>
      </div>
    </div>
  }

  <footer class="cart-page__footer">
    <strong>Total: {{ cartStore.total() | currencyFormat }}</strong>
    <button tuiButton type="button" size="l" (click)="goToCheckout()">Checkout</button>
  </footer>
</section>
