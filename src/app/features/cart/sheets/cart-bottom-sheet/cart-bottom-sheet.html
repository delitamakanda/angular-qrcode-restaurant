<div class="cart-sheet">
  <ul class="cart-sheet__list">
    @for (item of cartStore.items(); track item.id) {
      <li class="cart-sheet__row">
        <div class="cart-sheet__info">
          <strong>{{ item.name }}</strong>
          <div>{{ item.quantity }} x {{ item.unit_base_price | currencyFormat }}</div>
          <div>Total: {{ item.total_price | currencyFormat }}</div>
        </div>
        <div class="cart-sheet__actions">
          <button
            tuiButton
            type="button"
            appearance="secondary"
            size="m"
            [attr.aria-label]="'Decrease quantity of ' + item.name"
            (click)="cartStore.updateQuantity(item.id, item.quantity - 1)"
          >
            −
          </button>
          <span aria-hidden="true">{{ item.quantity }}</span>
          <button
            tuiButton
            type="button"
            appearance="secondary"
            size="m"
            [attr.aria-label]="'Increase quantity of ' + item.name"
            (click)="cartStore.updateQuantity(item.id, item.quantity + 1)"
          >
            +
          </button>
          <button
            tuiButton
            type="button"
            appearance="flat"
            size="m"
            [attr.aria-label]="'Remove ' + item.name + ' from cart'"
            (click)="cartStore.removeFromCart(item.id)"
          >
            Remove
          </button>
        </div>
      </li>
    }
  </ul>

  <footer class="cart-sheet__footer">
    <strong>Total: {{ cartStore.total() | currencyFormat }}</strong>
    <button tuiButton type="button" size="l" (click)="checkout()">Checkout</button>
  </footer>
</div>
