@if (store(); as store) {
  <section class="welcome-page">
    <app-store-hero [store]="store" />

    <div class="welcome-page__content">
      @if (stores().length > 1) {
        <app-store-switcher
          class="welcome-page__switcher"
          [stores]="stores()"
          [selectedId]="store.id"
          (storeSelected)="selectStore($event)"
        />
      }
      @if (!isOpen()) {
        <p class="welcome-page__closed" role="status">
          This restaurant is currently closed. Ordering is unavailable for now.
        </p>
      }
      <h2 class="welcome-page__title">Select your order mode</h2>
      <app-order-mode-selector
        [modes]="store.supported_modes"
        [selected]="selectedMode()"
        [disabled]="!isOpen()"
        (modeSelected)="selectMode($event)"
      />
    </div>
  </section>
}
