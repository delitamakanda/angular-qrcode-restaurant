<section class="favorites-page">
  <h2>Favoris</h2>

  @if (favoriteItems().length === 0) {
    <p class="favorites-page__empty">Aucun favori pour le moment.</p>
  } @else {
    <div class="favorites-page__grid">
      @for (item of favoriteItems(); track item.id) {
        <app-menu-item-card [item]="item" />
      }
    </div>
  }
</section>
