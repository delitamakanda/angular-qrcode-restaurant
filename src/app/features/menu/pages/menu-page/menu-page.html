<section class="menu-page">
  <div class="menu-page__nav">
    <tui-textfield tuiTextfieldSize="m" [tuiTextfieldCleaner]="true">
      <label tuiLabel for="menu-search">Search a product</label>
      <input
        tuiInput
        id="menu-search"
        type="search"
        autocomplete="off"
        [formControl]="searchControl"
      />
      <tui-icon icon="@tui.search" aria-hidden="true" />
    </tui-textfield>
    <app-menu-category-selection
    class="menu-page__categories"
    [categories]="menuStore.categories()"
    [selectedId]="menuStore.selectedCategoryId()"
    (selectionChange)="menuStore.setSelectedCategory($event)"
  />
  </div>
  <div class="menu-page__grid" [attr.aria-busy]="menuStore.isLoading()">
    @if (menuStore.isLoading()) {
      <span class="menu-page__visually-hidden" role="status">Loading menu…</span>
      @for (slot of skeletonSlots; track $index) {
        <app-menu-item-card-skeleton />
      }
    } @else {
      @for (item of menuStore.filteredItems(); track item.id) {
        <app-menu-item-card [item]="item" [priority]="$index < 2" />
      }
    }
  </div>
</section>
