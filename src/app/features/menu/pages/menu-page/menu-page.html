<section class="menu-page">
  <div class="menu-page__nav">
    <tui-textfield tuiTextfieldSize="m" [tuiTextfieldCleaner]="true">
      <label tuiLabel for="menu-search">Search a product</label>
      <input
        tuiInput
        id="menu-search"
        type="search"
        autocomplete="off"
        [formControl]="searchControl"
      />
      <tui-icon icon="@tui.search" aria-hidden="true" />
    </tui-textfield>
    <app-menu-category-selection
      class="menu-page__categories"
      [categories]="navCategories()"
      [activeId]="menuStore.activeCategoryId()"
      (categorySelected)="scrollToCategory($event)"
    />
  </div>
  <div class="menu-page__sections" [attr.aria-busy]="menuStore.isLoading()">
    @if (menuStore.isLoading()) {
      <div class="menu-page__grid">
        <span class="menu-page__visually-hidden" role="status">Loading menu…</span>
        @for (slot of skeletonSlots; track $index) {
          <app-menu-item-card-skeleton />
        }
      </div>
    } @else {
      @for (section of menuStore.itemsByCategory(); track section.category.id) {
        <section class="menu-page__section" [id]="'category-' + section.category.id">
          <h2 class="menu-page__section-title">{{ section.category.name }}</h2>
          <div class="menu-page__grid">
            @for (item of section.items; track item.id) {
              <app-menu-item-card [item]="item" [priority]="priorityIds().has(item.id)" />
            }
          </div>
        </section>
      }
    }
  </div>
</section>
