<nav class="menu-category-selection" aria-label="Catégories du menu">
  @for (category of categories(); track category.id) {
    <button
      #chip
      type="button"
      class="menu-category-selection__chip"
      [attr.data-id]="category.id"
      [class.menu-category-selection__chip--active]="activeId() === category.id"
      [attr.aria-current]="activeId() === category.id ? 'true' : null"
      (click)="categorySelected.emit(category.id)"
    >
      {{ category.name }}
    </button>
  }
</nav>
