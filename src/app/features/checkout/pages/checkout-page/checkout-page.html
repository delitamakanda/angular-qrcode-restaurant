<section class="checkout-page">
  <h1>Checkout</h1>

  <form [formGroup]="checkoutForm" (ngSubmit)="submitForm()">
    <div class="checkout-page__field">
      <tui-textfield>
        <label tuiLabel for="name">Name</label>
        <input
          tuiTextfield
          type="text"
          id="name"
          autocomplete="name"
          formControlName="name"
          required
        />
      </tui-textfield>
      <tui-error formControlName="name" />
    </div>

    <div class="checkout-page__field">
      <tui-textfield>
        <label tuiLabel for="phone">Phone number</label>
        <input
          tuiTextfield
          type="tel"
          id="phone"
          inputmode="tel"
          autocomplete="tel"
          formControlName="phone"
          required
        />
      </tui-textfield>
      <tui-error formControlName="phone" />
    </div>

    <label for="payment-method">Payment method</label>
    <select id="payment-method" formControlName="paymentMethod" required>
      <option value="cash">Cash</option>
      <option value="card">Visa/Mastercard</option>
    </select>

    <div class="checkout-page__field">
      <tui-textfield>
        <label tuiLabel for="coupon-code">Coupon code (optional)</label>
        <input
          tuiTextfield
          type="text"
          id="coupon-code"
          autocomplete="off"
          formControlName="couponCode"
        />
      </tui-textfield>
    </div>

    <button type="submit" [disabled]="checkoutStore.submitting()">Submit</button>
  </form>
</section>
