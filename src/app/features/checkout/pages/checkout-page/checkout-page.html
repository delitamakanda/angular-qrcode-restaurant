<section class="checkout-page">
  <h1>Checkout</h1>

  <form [formGroup]="checkoutForm" (ngSubmit)="submitForm()">
    <div class="checkout-page__field">
      <tui-textfield>
        <label tuiLabel for="name">Name</label>
        <input tuiInput type="text" id="name" autocomplete="name" formControlName="name" required />
      </tui-textfield>
      <tui-error formControlName="name" />
    </div>

    <div class="checkout-page__field">
      <app-phone-input
        formControlName="phone"
        inputId="phone"
        label="Phone number"
        [required]="true"
        [ariaInvalid]="phoneError() ? 'true' : 'false'"
        [ariaDescribedby]="phoneError() ? 'phone-error' : null"
      />
      @if (phoneError(); as message) {
        <p id="phone-error" class="checkout-page__error-text" role="alert">{{ message }}</p>
      }
    </div>

    <div class="checkout-page__field">
      <tui-textfield tuiChevron>
        <label tuiLabel for="payment-method">Payment method</label>
        <input tuiSelect id="payment-method" formControlName="paymentMethod" required />
        <tui-data-list-wrapper *tuiDropdown [items]="paymentOptions" />
      </tui-textfield>
    </div>

    <div class="checkout-page__field">
      <tui-textfield>
        <label tuiLabel for="coupon-code">Coupon code (optional)</label>
        <input
          tuiInput
          type="text"
          id="coupon-code"
          autocomplete="off"
          formControlName="couponCode"
        />
      </tui-textfield>
    </div>

    <button tuiButton type="submit" size="l" [disabled]="checkoutStore.submitting()">Submit</button>
  </form>
</section>
