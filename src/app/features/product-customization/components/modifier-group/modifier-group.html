<fieldset class="modifier-group" [attr.aria-invalid]="invalid() ? 'true' : null">
  <legend class="modifier-group__legend">
    <span class="modifier-group__name">{{ group().name }}</span>
    <span class="modifier-group__badge">{{ isRequired() ? 'Required' : 'Optional' }}</span>
    @if (hint()) {
      <span class="modifier-group__hint">{{ hint() }}</span>
    }
  </legend>
  @for (option of group().options; track option.id) {
    <label
      class="modifier-group__option"
      [class.modifier-group__option--selected]="isChecked(option.id)"
      [class.modifier-group__option--disabled]="isDisabled(option.id, option.is_available)"
    >
      <input
        class="modifier-group__input"
        [type]="single() ? 'radio' : 'checkbox'"
        [name]="group().id"
        [value]="option.id"
        [checked]="isChecked(option.id)"
        [disabled]="isDisabled(option.id, option.is_available)"
        (change)="optionToggled.emit(option.id)"
      />
      <span class="modifier-group__label">
        {{ option.name }}
        @if (!option.is_available) {
          <span class="modifier-group__unavailable">(unavailable)</span>
        }
      </span>
      @if (option.price_delta) {
        <span class="modifier-group__delta">
          {{ option.price_delta > 0 ? '+' : '' }}{{ option.price_delta | currencyFormat }}
        </span>
      }
    </label>
  }
  @if (single() && !isRequired() && selected().length > 0) {
    <button type="button" class="modifier-group__clear" (click)="cleared.emit()">
      Clear {{ group().name }}
    </button>
  }
</fieldset>
