<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QR Restaurant</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Order food from your favorite restaurant by scanning a QR code. Browse the menu, customize your order, and pay online."
    />
    <meta name="theme-color" content="#e8141c" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the light theme.
      (function () {
        var theme = 'system';
        try {
          var stored = localStorage.getItem('app-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        if (theme === 'system') {
          theme =
            window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
